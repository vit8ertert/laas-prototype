const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('laas-prototype:'+v));const hx=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

else{d.querySelector('.gate-err').hidden=false;d.querySelector('input').select();}});});})();</script>

function sendPreview(kind,inSheet){

 offer:{t:'Send the offer to Mette Kjær',s:'Saturday hotel gig, 25 Oct, fee 4.500 DKK excl. moms, deposit 30 %',to:'Mette Kjær, booking@hotelroyal.dk',subj:'Tilbud: Low Tide, Hotel Royal, 25. oktober',body:'Hej Mette, her er vores tilbud på koncerten 25. oktober. I linket kan du se vilkårene, underskrive og betale depositum på 1.500 DKK: laas.app/o/LT-2026-031. Vi holder datoen til fredag den 10. Venlig hilsen, Low Tide',send:'Send offer',act:'offersent'},
 nudge:{t:'Send a nudge to Mette Kjær',s:'Offer for 25 Oct, opened 8 Oct, not signed',to:'Mette Kjær, booking@hotelroyal.dk',subj:'Tilbud: Low Tide, 25. oktober',body:'Hej Mette, kort opfølgning på tilbuddet til 25. oktober. Vi holder datoen til fredag den 10. Linket: laas.app/o/LT-2026-031. Venlig hilsen, Low Tide',send:'Send nudge',act:'nudgesent'}}[kind];
 return `<div class="send"><div><h3 class="t-heading">${d.t}</h3><p class="muted" style="margin:2px 0 0">${d.s}</p></div>
 <div class="row t-label"><span class="muted">To</span>${S.toEdit?`<input class="input" style="flex:1;min-width:200px;height:32px" id="toedit" data-kind="${kind}" value="${esc(S.toVal[kind]||d.to)}" aria-label="To"><button class="link" data-act="toedit">Done</button>`:`<span style="font-size:15px">${esc(S.toVal[kind]||d.to)}</span><button class="link" data-act="toedit">Change</button>`}</div>
 <div class="msg ${S.fullmsg?'full':''}"><b class="strong">${d.subj}</b>${S.editMsg?`<textarea class="input" id="msgedit" data-kind="${kind}" rows="5" aria-label="Message">${esc(S.msgVal[kind]||d.body)}</textarea>`:`<p>${esc(S.msgVal[kind]||d.body)}</p>`}<button class="link" style="align-self:flex-start" data-act="fullmsg">${S.fullmsg?'Show less':'Show full message'}</button></div>
 <div class="row"><button class="btn ghost flush" data-act="${inSheet?'closesheet':kind==='reminder'?'snooze':'close'}">${kind==='reminder'?'Snooze 3 days':'Not now'}</button><span style="flex:1"></span><button class="btn secondary" data-act="editmsg">${ic(S.editMsg?'check':'pencil','s')}${S.editMsg?'Done editing':'Edit text'}</button><button class="btn accent" data-act="${d.act}">${ic('send','s')}${d.send}</button></div></div>`;
}

${S.rtab==='overview'?`

 const sugg=[['Move the hotel gig to Saturday 25 Oct and tell the venue','plan'],['Who still owes us money?','money'],['What is left before Saturday?','gigday'],['Nudge Mette about the offer','nudge']];

  :`<p class="muted" style="margin:0">Cancelled. Nothing was changed.</p>`);

VIEWS.audience=()=>{const t=S.atab;const head=`<div class="ph"><div class="grow"><h1 class="t-display">Audience</h1><p>${S.audConnected?'Read-only in v1, Spotify for Artists and figures you type in, posting lives in Social posts':'Nothing connected yet, read-only in v1'}</p></div><button class="btn secondary" data-act="addfigures">${ic('plus','s')}Add figures</button><button class="btn accent" data-act="connectsvc">${ic('plug','s')}Connect a service</button><button class="btn secondary icon" aria-label="More" data-act="audmore">${ic('more')}</button></div>`;

 if(!S.audConnected)return `<div class="page">${head}<section class="card" style="display:flex;flex-direction:column;gap:20px;border:1px solid var(--rule)"><div><h3 class="t-heading">No audience numbers yet</h3><p class="muted" style="margin:6px 0 0">Connect Spotify for Artists or YouTube (read-only), or type in the figures you have. LAAS never posts for you and never shows these numbers to venues.</p></div><div class="row" style="align-items:stretch;gap:12px">${[['Connect Spotify for Artists','Read-only, listeners, followers, streams, cities','connectspotify'],['Connect YouTube','Read-only, subscribers and views','connectyoutube'],['Type a figure in','Apple Music, Tidal, Deezer, Bandcamp: one number a month is enough','addfigures']].map(([a,b,act])=>`<button class="card" data-act="${act}" style="flex:1;min-width:200px;text-align:left;background:var(--raised);display:flex;flex-direction:column;gap:6px"><b class="strong">${a}</b><span class="t-meta muted">${b}</span></button>`).join('')}</div></section>
 <div class="row" style="gap:12px;align-items:stretch">${kpi('Monthly listeners','—','from Spotify')}${kpi('Followers','—','Spotify and YouTube')}${kpi('Streams, last 28 days','—','from Spotify')}${kpi('Figures by hand','—','anything without an API')}</div></div>${audAbar()}`;
 const tabs=`<div class="tabs" role="tablist">${[['overview','Overview'],['streaming','Streaming'],['hand','Figures by hand',S.figures.length],['releases','Releases']].map(([k,l,c])=>`<button role="tab" class="${t===k?'on':''}" data-atab="${k}">${l}${c?`<span class="c">${c}</span>`:''}</button>`).join('')}</div>`;
 const max=Math.max(...AUD.listeners);
 const chart=`<section class="card" style="border:1px solid var(--rule);display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h3 class="t-title" style="flex:1">Listeners, last 12 months</h3><button class="btn ghost s" data-act="datatable">${ic(S.dataTable?'x':'right','s')}${S.dataTable?'Hide data table':'Show data table'}</button></div>
  <div style="display:flex;align-items:flex-end;gap:8px;height:96px">${AUD.listeners.map((n,i)=>`<div title="${AUD.months[i]}: ${kr(n)}" style="flex:1;height:${Math.round(n/max*60)}px;border-radius:3px;background:${i===11?'var(--accent)':'var(--top)'}"></div>`).join('')}</div>
  <div class="row t-meta"><span class="muted">Nov 2025 → Oct 2026, Spotify monthly listeners</span><span><span style="color:var(--accent)">●</span> release months: Feb, May</span></div>

  <span class="t-meta muted">One source per line. Hand-entered figures are drawn dashed and never mixed into a total with API figures.</span></section>`;
 const services=`<section class="card" style="border:1px solid var(--rule);padding:20px 20px 4px"><div class="sec-h"><h3 class="t-title" style="flex:1">By service</h3><button class="btn ghost s" data-act="connectsvc">${ic('plus','s')}Connect another</button></div>${AUD.services.map(([id,n,d,tg])=>`<button class="list-row" data-act="svc" data-id="${id}"><span class="tx"><b>${n}</b><small>${d}</small></span><span class="tag ${tg[0]}">${tg[1]}</span>${ic('right','s')}</button>`).join('')}</section>`;
 const where=`<section class="card" style="border:1px solid var(--rule);display:flex;flex-direction:column;gap:10px"><h3 class="t-title">Where they are</h3>${AUD.cities.map(([c,p])=>`<div style="display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center"><span>${c}</span><span style="height:6px;border-radius:3px;background:var(--well)"><i style="display:block;height:100%;width:${p/31*100}%;border-radius:3px;background:var(--accent)"></i></span><span class="mono" style="text-align:right">${p} %</span></div>`).join('')}<span class="t-meta muted">Spotify, last 28 days. Use it to pick the next gig city; the assistant can suggest venues there.</span></section>`;

 <div class="row" style="gap:12px;align-items:stretch">${kpi('Monthly listeners','2.340','Spotify, +18 % vs September',1)}${kpi('Followers','1.102','Spotify 870, YouTube 232',1)}${kpi('Streams, last 28 days','14.800','Spotify, “Low Tide” is 61 %')}${kpi('Figures by hand',S.figures.length+' entries','Tidal, Apple Music, Deezer and more, last 1 Oct')}</div>
 <div class="grid2 aud"><div style="display:flex;flex-direction:column;gap:16px">${chart}${services}</div><div style="display:flex;flex-direction:column;gap:16px">${where}${rel}</div></div>`;

 else if(t==='hand')body=`<section class="card" style="border:1px solid var(--rule);padding:20px 20px 4px"><div class="sec-h"><h3 class="t-title" style="flex:1">Figures by hand</h3><button class="btn secondary s" data-act="addfigures">${ic('plus','s')}Add figures</button></div>${S.figures.map(([d,sv,what,n])=>`<div class="list-row" style="cursor:default"><span class="mono muted" style="width:64px">${d}</span><span class="tx"><b>${sv}</b><small>${what}</small></span><span class="mono">${n}</span></div>`).join('')}</section><p class="t-meta muted" style="margin:0">Typed-in figures are kept apart from API figures and drawn dashed on charts.</p>`;

"btn accent" data-ob="1" style="justify-content:center">Continue with email</button><p class="t-meta muted">Already have an account? <button class="link" data-act="obexit">Log in</button>. By continuing you accept the terms and the privacy policy.</p>`,
  ()=>`<div><h1 class="t-title">Check your inbox</h1><p class="muted">We sent a 6-digit code and a sign-in link to vital@lowtide.dk. Both work for 15 minutes.</p></div><div class="code">${[4,1,7,'','',''].map((d,i)=>`<input aria-label="Digit ${i+1}" value="${d}" maxlength="1">`).join('')}</div><div class="row"><button class="btn accent" data-ob="2">Continue</button><a class="btn secondary" style="text-decoration:none" href="https://mail.google.com" target="_blank" rel="noopener">Open Gmail</a><button class="btn ghost" data-act="resend" ${S.resent?'disabled':''}>${S.resent?'Code sent again':'Resend in 30 s'}</button></div><p class="t-meta muted" style="margin:0">Wrong address? <button class="link" data-ob="0">Use a different email</button>.</p>`,
  ()=>`<div><h1 class="t-title">About you</h1><p class="muted">Takes a minute. You can change all of it in Account.</p></div><div class="row"><img src="${S.photos.you||IMG('booker')}" style="width:72px;height:72px;border-radius:50%;object-fit:cover" alt=""><label class="btn secondary s" style="cursor:pointer">${ic('upload','s')}Change photo<input type="file" accept="image/*" hidden data-photo="you"></label></div><div class="field"><label for="yn">Your name</label><input class="input" id="yn" value="Vital Sinkevich"></div><div class="field"><label for="yp">You play</label><input class="input" id="yp" value="Vocals, guitar"></div><button class="btn accent" data-ob="3" style="align-self:flex-start">Continue</button>`,
  ()=>`<div><h1 class="t-title">Your band</h1><p class="muted">One account can run several bands. Start with this one.</p></div><div class="row"><img src="${S.photos.band||IMG('band-collage')}" style="width:96px;height:96px;border-radius:12px;object-fit:cover" alt=""><label class="btn ghost s" style="cursor:pointer">${ic('upload','s')}Replace<input type="file" accept="image/*" hidden data-photo="band"></label></div><div class="field"><label for="bnm">Band name</label><input class="input" id="bnm" value="Low Tide"></div><div class="field"><label for="bc">Home city</label><input class="input" id="bc" value="Odense"></div><div class="row"><button class="btn ghost" data-ob="2">Back</button><button class="btn accent" data-ob="4">Continue</button></div>`,
  ()=>`<div><h1 class="t-title">What do you play?</h1><p class="muted">LAAS dresses itself for your genre: colours, type and the logo. Switch any time, or keep the default.</p></div><div class="row" style="gap:8px">${(LAAS.GENRES||['Indie and rock','Metal and hardcore','Electronic','Classical']).map(g=>`<button class="qtag ${S.onboarding.genre===g?'on':''}" data-obgenre="${g}">${g}</button>`).join('')}</div><div class="theme-grid">${themeCards()}</div>${appearanceSeg()}<div class="row"><button class="btn ghost" data-ob="3">Back</button><button class="btn secondary" data-act="obdefault">Keep the default</button><button class="btn accent" data-ob="5">Use ${({label:'Default',metal:'Metal',electronic:'Electronic',classical:'Classical'})[S.genre]}</button></div>`,
  ()=>`<div><h1 class="t-title">Bring the band</h1><p class="muted">They get an email to join Low Tide. Nobody pays per member.</p></div>${['jonas@lowtide.dk','mia.bass@gmail.com'].map(m=>`<div class="row"><input class="input" style="flex:1" value="${m}" aria-label="Email"><select class="input" style="width:140px" aria-label="Role"><option>Member</option><option>Admin</option><option>Viewer</option></select></div>`).join('')}<p class="t-meta muted">Owner and Admin see money and can send. Member sees gigs, the day sheet and their own payouts. Viewer sees dates only.</p><div class="row"><button class="btn ghost" data-act="obdone">Skip for now</button><button class="btn accent" data-act="obdone">${ic('send','s')}Send 2 invites</button></div>`];
 return `<div class="ob"><div class="l"><div class="row"><div class="logo">${LOGO}</div><span style="flex:1"></span>${st>=2?`<span class="t-meta muted">Step ${st-1} of 4</span>`:''}${flowBtnInline()}<button class="btn ghost s" data-act="obexit">Exit</button></div>${st>=2?`<div class="bar4">${[1,2,3,4].map(i=>`<i class="${i<=st-1?'on':''}"></i>`).join('')}</div>`:''}<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px">${steps[st]()}</div></div><div class="r"><img src="${IMG(photo)}" alt=""></div></div>`;}

/* ---------- overlays ---------- */
function overlay(){const o=S.overlay;if(!o)return '';if(LAAS.OVERLAYS[o.type])return LAAS.OVERLAYS[o.type](o);
 if(o.type==='palette'){const q=(o.q||'').toLowerCase();const res=[];
  if(!q){res.push(['Recent',[['Saturday hotel gig','Booking, Sat 25 Oct, Hotel Royal','booking',{},'hotel-royal'],['Mette Kjær, Hotel Royal','Contact, venue booker','contact',{id:'c1'},'booker'],['Late Shift EP','Release, out 14 Nov','release',{},'cover-late-shift']]]);res.push(['Jump to',[['Bookings','','bookings',{}],['Money','','money',{}],['Gig day','','gigday',{}]]]);}
  else{const c=CONTACTS.filter(x=>x.name.toLowerCase().includes(q)).map(x=>[x.name,x.kind+', '+x.where,'contact',{id:x.id},V(x.venue).img]);const b=BOOKINGS.filter(x=>(x.title+' '+(x.venue?V(x.venue).name:'')).toLowerCase().includes(q)).map(x=>[x.title,x.when+', '+(x.venue?V(x.venue).name:'No venue'),'booking',{},x.venue?V(x.venue).img:null]);const v=VENUES.filter(x=>x.name.toLowerCase().includes(q)).map(x=>[x.name,'Venue, '+x.city,'venue',{id:x.id},x.img]);
   if(c.length)res.push(['Contacts',c.slice(0,3)]);if(b.length)res.push(['Bookings',b.slice(0,3)]);if(v.length)res.push(['Venues',v.slice(0,3)]);res.push(['Actions',[[`New booking “${o.q}”`,'','newbooking',{}],[`Ask the assistant about “${o.q}”`,'','assistant',{}]]]);}
  let k=0;const sel=o.sel||0;
  return `<div class="scrim" data-act="close"></div><div class="pop pal" role="dialog" aria-label="Search"><div class="f">${ic('search')}<input id="palq" value="${esc(o.q||'')}" placeholder="Search bookings, people, venues, invoices, mail" aria-label="Search"><kbd class="k">Esc</kbd></div>
  ${q&&res.length===1?`<div style="padding:16px 20px"><b class="t-heading">No match for “${esc(o.q)}”</b><p class="muted" style="margin:4px 0 0">Nothing in bookings, contacts or venues. Check the spelling, or start from here.</p></div>`:''}
  ${res.map(([g,items])=>`<div class="g"><div class="gl">${g}</div>${items.map(([t,m,v,p,im])=>{const i=k++;return `<button class="it ${i===sel?'on':''}" data-pgo="${v}" data-pp='${JSON.stringify(p)}'>${im?`<img class="thumb s" src="${IMG(im)}" alt="">`:`<span class="thumb s" style="display:grid;place-items:center">${ic(v==='newbooking'?'plus':v==='assistant'?'ai':'right','s')}</span>`}<span><span>${hl(t,o.q||'')}</span>${m?`<br><span class="t-meta muted">${m}</span>`:''}</span></button>`}).join('')}</div>`).join('')}
  <div class="ft"><span><kbd class="k">↑↓</kbd> move</span><span><kbd class="k">↵</kbd> open</span><span style="margin-left:auto">Type to search everything</span></div></div>`;}
 if(o.type==='notifs')return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop notif" role="dialog" aria-label="Notifications"><div class="row" style="padding:14px 16px 6px"><b class="t-heading" style="flex:1">Notifications</b><button class="btn ghost s" data-act="readall">${ic('check','s')}Mark all read</button></div>
  <div class="row" style="padding:0 16px 8px;gap:4px"><button class="chip ${o.f!=='need'?'on':''}" data-nf="all">All</button><button class="chip ${o.f==='need'?'on':''}" data-nf="need">Needs you 2</button></div><div style="padding:0 8px 8px">
  ${S.notifs.filter((n,i)=>o.f!=='need'||i<2).map((n,i)=>`<button class="ni ${n.unread?'unread':''}" data-ni="${i}"><span class="dot"></span><img class="thumb" src="${IMG(V(n.v).img)}" alt=""><span><b>${n.t}</b><br><span class="t-meta muted">${n.m}</span><br><span class="t-meta faint">${n.time}</span></span></button>`).join('')}</div></div>`;
 if(o.type==='thememenu')return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop" style="left:16px;bottom:120px;width:300px;padding:6px" role="dialog" aria-label="Theme"><div class="t-meta faint" style="padding:6px 10px">Theme for Low Tide</div>${THEMES.map(([id,n,d,c])=>`<button class="it row" style="width:100%;padding:8px 10px;border-radius:8px;${S.genre===id?'background:var(--well)':''}" data-genre="${id}"><span class="swatch" style="width:56px;height:36px">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span><span style="flex:1;text-align:left"><b class="strong">${n}</b><br><span class="t-meta muted">${d}</span></span>${S.genre===id?ic('check','s'):''}</button>`).join('')}<div style="padding:8px 10px">${appearanceSeg()}</div><button class="it row" style="width:100%;padding:8px 10px" data-genre="label">${ic('undo','s')}Reset to default</button></div>`;
 if(o.type==='statusmenu'){const opts=['Confirmed','Draft','Attention','Paid','Completed'];return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop" style="left:${o.x}px;top:${o.y}px;width:260px;padding:6px" role="dialog" aria-label="Filter by status"><div class="t-meta faint" style="padding:6px 10px">Status</div>${opts.map(s=>`<label class="row" style="padding:8px 10px;gap:10px;cursor:pointer"><input type="checkbox" data-sf="${s}" ${S.statusFilter.includes(s)?'checked':''} style="width:16px;height:16px;accent-color:var(--ink)"><span style="flex:1">${s}</span><span class="t-meta faint">${BOOKINGS.filter(b=>STATUS[b.status][1]===s).length}</span></label>`).join('')}<div style="border-top:1px solid var(--rule);padding:4px"><button class="btn ghost s" data-act="clearfilter">Clear</button></div></div>`;}
 if(o.type==='statusmenu2')return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop smenu" role="menu" style="left:${o.x}px;top:${o.y}px"><div class="smenu-h">Status follows documents</div>${[['enquiry','Enquiry','Someone asked. Reply or hold the date.'],['hold','Hold','Date reserved until an expiry. Band availability asked.'],['offer','Offer out','Moves here when the offer link is sent.'],['confirmed','Confirmed','Moves here when the offer is signed or the deposit paid.'],['completed','Completed','Moves here after the gig date, once you settle.']].map(([k,l,d])=>`<button class="smenu-it ${S.booking.state===k&&!S.booking.cancelled?'on':''}" role="menuitem" data-bstate="${k}"><span class="schip ${k}"><i></i>${l}</span><span class="smenu-d">${d}</span>${S.booking.state===k&&!S.booking.cancelled?ic('check','s'):''}</button>`).join('')}<hr class="smenu-rule"><button class="smenu-it ${S.booking.cancelled?'on':''}" role="menuitem" data-act="${S.booking.cancelled?'uncancel':'cancelbooking'}"><span class="schip cancelled"><i></i>Cancelled</span><span class="smenu-d">Asks for a reason and what happens to the deposit.</span>${S.booking.cancelled?ic('check','s'):''}</button><div class="smenu-f">Moving by hand is logged with your name. The assistant can propose moves; nothing changes without Confirm.</div></div>`;
 if(o.type==='chipmenu'){const c=CHIPS[o.key];return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop" style="left:${o.x}px;top:${o.y}px;width:260px;padding:6px" role="dialog" aria-label="Filter by ${c.label}"><div class="t-meta faint" style="padding:6px 10px">${c.label}</div>${c.opts.map(x=>`<label class="row" style="padding:8px 10px;gap:10px;cursor:pointer"><input type="checkbox" data-cf="${o.key}|${x}" ${S.filters[o.key].includes(x)?'checked':''} style="width:16px;height:16px;accent-color:var(--ink)"><span style="flex:1">${x}</span><span class="t-meta faint">${c.n(x)}</span></label>`).join('')}<div style="border-top:1px solid var(--rule);padding:4px"><button class="btn ghost s" data-act="clearchip" data-key="${o.key}">Clear</button></div></div>`;}
 if(o.type==='menu')return `<div class="scrim" style="background:transparent" data-act="close"></div><div class="pop" style="left:${o.x}px;top:${o.y}px;width:260px;padding:6px" role="menu">${o.items.map(([l,a,danger,text])=>`<button class="it row" role="menuitem" style="width:100%;padding:8px 10px;border-radius:8px;text-align:left;${danger?'color:var(--bad)':''}" data-act="${a}" ${text?`data-text="${text}"`:''}>${l}</button>`).join('')}</div>`;
 if(o.type==='modal')return `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true">${o.html}</div>`;
 if(o.type==='drawer')return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="dh"><div class="grow"><h2 class="t-title">${o.title}</h2><span class="t-meta muted">${o.sub||''}</span></div><button class="btn ghost s" data-act="close">${ic('x','s')}Close</button></div><div class="db">${o.body}</div><div class="df">${o.foot}</div></aside>`;
 return '';}

 newbooking:(name='')=>({type:'drawer',title:'New booking',sub:'Describe it, we fill the fields',body:`<div class="field"><label for="nbw">What</label><input class="input" id="nbw" value="${esc(name||'Hotel gig')}"><span class="help">From your words, edit if wrong</span></div><div class="field"><label for="nbt">When</label><input class="input" id="nbt" value="Fri 24 Oct 2026, 20:00"></div><div class="field"><label for="nbv">Where</label><input class="input" id="nbv" value="Hotel Royal, Aarhus"><span class="help">Matched, capacity 120</span></div>

 newcontact:()=>({type:'drawer',title:'New contact',sub:'Only a name is needed',body:`<div class="field"><label>This contact is a</label><div class="seg"><button class="on">Person</button><button>Organisation</button></div></div><div class="field"><label for="ncn">Name</label><input class="input" id="ncn" value="${esc(S.contactSearch||'Mette Kjær')}"></div><div class="field"><label for="nco">Organisation</label><input class="input" id="nco" value="Hotel Royal"></div><div class="field"><label for="nce">Email</label><input class="input" id="nce" value="booking@hotelroyal.dk"></div>`,foot:`<span style="flex:1"></span><button class="btn secondary" data-act="close">Cancel</button><button class="btn accent" data-act="createcontact">Create contact</button>`}),

 import:()=>{const st=S.import.step;return {type:'drawer',title:'Import contacts',sub:`Step ${st} of 3, ${['','where your contacts are now','match the columns','check before saving'][st]}`,
  body:st===1?`<div class="drop">${ic('upload')}<b class="strong">Drop a CSV, Excel or vCard file here</b><span class="t-meta muted">Exports from Google, Outlook, iPhone or a spreadsheet all work.</span><label class="btn secondary s" style="align-self:flex-start;cursor:pointer">Choose file<input type="file" accept=".csv,.xlsx,.xls,.vcf" hidden data-importfile></label></div><div class="sec"><span class="t-label muted">Or connect an account</span>${['Google Contacts','Outlook or Microsoft 365','From my mail'].map(t=>`<button class="list-row" data-act="importnext" data-file="${t}">${ic('plug')}<span class="tx"><b>${t}</b><small>Reads once, writes nothing back</small></span></button>`).join('')}</div>`
  :st===2?`<div class="list-row" style="border:1px solid var(--rule-strong);border-radius:10px;padding:12px 14px">${ic('file')}<span class="tx"><b>${esc(S.import.file||'contacts-2026.csv')}</b><small>212 rows, 8 columns, Danish headers</small></span></div><p class="muted" style="margin:0">Each column goes to one LAAS field. We guessed from the headers; change any guess that is wrong.</p>${[['Navn','Name','e.g. Mette Krogh'],['Firma','Organisation','e.g. Hotel Skov'],['E-mail','Email','e.g. mette@hotelskov.dk'],['Telefon','Phone','e.g. 21 43 65 87'],['Fødselsdag','Don’t import','LAAS has no birthday field']].map(([a,b,c])=>`<div class="field"><label>${a}</label><select class="input"><option>${b}</option><option>Name</option><option>Don’t import</option></select><span class="help">${c}</span></div>`).join('')}`
  :`<dl class="kv"><dt>New contacts</dt><dd class="mono">198</dd><dt>Merged</dt><dd class="mono">9</dd><dt>Skipped</dt><dd class="mono">5</dd></dl><label class="row" style="gap:10px"><input type="checkbox" checked style="width:16px;height:16px;accent-color:var(--ink)">Merge the 9 duplicates (recommended)</label><div class="banner info">${ic('alert')}<div class="tx"><b>Nothing is sent to anyone</b><span class="t-label muted">Imported contacts get an Imported tag. You can undo the whole import for 7 days.</span></div></div>`,

/* ---------- render ---------- */
function render(){
 const root=document.documentElement;
 if(S.appearance==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',S.appearance);
 if(S.genre==='label')root.removeAttribute('data-genre');else root.setAttribute('data-genre',S.genre);
 const app=document.getElementById('app');
 const prevFocus=document.activeElement&&document.activeElement.id;const selStart=document.activeElement&&document.activeElement.selectionStart;
 const mainScroll=document.querySelector('.main')?.scrollTop||0;
 if(S.view==='onboarding'){app.innerHTML=(LAAS.ONBOARDING||onboarding)()+overlay()+toastHtml()+flowBtn();}
 else app.innerHTML=`<div class="app">${topbar()}<div class="body ${S.collapsed?'collapsed':''}">${sidebar()}<main class="main" id="main">${(VIEWS[S.view]||VIEWS.dashboard)()}</main></div>${LAAS.tabbar?LAAS.tabbar():''}</div>${overlay()}${toastHtml()}${flowBtn()}`;
 const m=document.querySelector('.main');if(m){m.scrollTop=mainScroll;if(S.enterUntil&&Date.now()<S.enterUntil){m.classList.add(S.enter||'enter');m.querySelectorAll('tbody tr,.list-row').forEach((r,i)=>r.style.setProperty('--i',Math.min(i,10)));}}
 if(prevFocus){const el=document.getElementById(prevFocus);if(el){el.focus();try{if(selStart!=null)el.setSelectionRange(selStart,selStart)}catch(e){}}}
 if(S.overlay&&S.overlay.type==='palette'){const q=document.getElementById('palq');if(q&&document.activeElement!==q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
 /* menus opened below their button flip above it when they would run off the bottom of the window (Vit 21 Oct, Add context) */
 document.querySelectorAll('.pop[style*="top:"]').forEach(p=>{const b=p.getBoundingClientRect();if(b.bottom<=innerHeight-8)return;
  const up=S.anchor?S.anchor.top-b.height-6:-1;p.style.top=Math.max(8,up>=8?up:innerHeight-b.height-8)+'px';});
 LAAS.afterRender&&LAAS.afterRender();
}
const toastHtml=()=>S.toast?`<div class="toast" role="status">${ic('check','s')}<span>${esc(S.toast.msg)}</span>${S.toast.undo?'<button class="btn ghost s" data-act="undo">Undo</button>':''}</div>`:'';
const FLOWS=[['First run','Sign up to the dashboard',()=>{S.onboarding.step=0;go('onboarding')}],['Book a gig','Bookings, search, filter, booking',()=>{S.bookTab='up';S.search='';go('bookings')}],['A booking’s life','Enquiry → hold → offer → confirmed → completed',()=>{S.booking={state:'enquiry',depositPaid:false,settled:false,rated:false,sheet:false,cancelled:false};go('booking')}],['Get paid','Overdue deposit, record, settle',()=>{S.booking.state='confirmed';S.booking.depositPaid=false;go('money')}],['Money from zero','No invoices yet, three ways to start',()=>LAAS.ACTIONS.mnyfromzero()],['Gig day','Timeline, open items',()=>{S.parkingDone=false;go('gigday')}],['Contacts import','Three-step import',()=>{S.imported=false;go('contacts')}],['A release','Empty catalogue to delivery',()=>{S.release={stage:'none',title:'Late Shift EP',tracks:0,progress:0};S.catalog=null;S.rtab='overview';go('catalogue')}],['Themes','Genre themes and light mode',()=>go('theme')],['Settings','Account, members, plan',()=>go('account')],['Audience','Empty, connect Spotify, metrics',()=>{S.audConnected=false;S.atab='overview';S.audBanner=true;go('audience')}]];
const flowBtnInline=()=>`<div class="flowbar"><button class="btn secondary s" data-act="flows">${ic('flow','s')}<span class="fl">Flows</span></button></div>`;
const flowBtn=()=>`${S.flowsOpen?`<div class="pop flowmenu" role="menu">${FLOWS.map((f,i)=>`<button data-flow="${i}" role="menuitem"><span style="flex:1"><b class="strong">${f[0]}</b><br><span class="t-meta muted">${f[1]}</span></span>${ic('right','s')}</button>`).join('')}</div>`:''}`;

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const segb=e.target.closest('.seg button');if(segb&&!segb.dataset.split&&!segb.dataset.appearance){segb.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===segb));return;}
 const rad=e.target.closest('.radio');if(rad){rad.parentElement.querySelectorAll('.radio').forEach(b=>b.classList.toggle('on',b===rad));if(rad.dataset.fix!==undefined){S.fixChoice=+rad.dataset.fix;const g=document.getElementById('fixgo');if(g)g.textContent=['Rename to Late Shift','Use the new cover','Send for manual review'][S.fixChoice];}return;}
 const pick=e.target.closest('[data-pick]');if(pick){pick.parentElement.querySelectorAll('[data-pick]').forEach(b=>b.style.boxShadow=b===pick?'0 0 0 2px var(--accent)':'none');return;}
 const t0=e.target.closest('[data-go],[data-act],[data-tab],[data-flow],[data-genre],[data-appearance],[data-ob],[data-obgenre],[data-pgo],[data-ni],[data-nf],[data-star],[data-qtag],[data-split],[data-bstate],[data-toggle],[data-mtab],[data-rtab],[data-atab]');/* the page root carries data-genre for the theme: a click that only reaches it is not a theme pick */const t=t0===document.documentElement?null:t0;
 if(!t){if(S.flowsOpen&&!e.target.closest('.flowmenu')){S.flowsOpen=false;render();}return;}
 if(t.dataset.flow!==undefined){S.flowsOpen=false;FLOWS[+t.dataset.flow][2]();return;}
 if(S.flowsOpen&&!t.closest('.flowmenu')&&t.dataset.act!=='flows')S.flowsOpen=false;
 if(t.dataset.go){if(t.dataset.mt)S.mtab=t.dataset.mt;if(t.dataset.ct&&S.cat)S.cat.tab=t.dataset.ct;if(t.dataset.at)S.atab=t.dataset.at;const id=t.dataset.id;if(t.dataset.go==='booking'&&id&&id!=='b1'){const b=BOOKINGS.find(x=>x.id===id);if(b&&b.status==='completed')S.booking.state='completed';}if(t.dataset.go==='rate'){S.booking.state='completed';S.booking.rated=false;return go('booking');}return go(t.dataset.go,id?{id}:{});}
 if(t.dataset.toggle){return go('bookings');}
 if(t.dataset.mtab){S.mtab=t.dataset.mtab;S.enter='tabenter';S.enterUntil=Date.now()+500;return render();}
 if(t.dataset.rtab){S.rtab=t.dataset.rtab;S.enter='tabenter';S.enterUntil=Date.now()+500;return render();}
 if(t.dataset.atab){S.atab=t.dataset.atab;S.enter='tabenter';S.enterUntil=Date.now()+500;return render();}
 if(t.dataset.tab){S.bookTab=t.dataset.tab;S.enter='tabenter';S.enterUntil=Date.now()+500;return render();}
 if(t.dataset.genre){const was=S.genre,next=t.dataset.genre;if(S.overlay&&S.overlay.type==='thememenu'){S.overlay=null;}/* the note paints first, the (heavier) theme repaint follows on the next frame (Vit: the note felt late) */toast(`Theme: ${({label:'Default',metal:'Metal',electronic:'Electronic',classical:'Classical'})[next]}`,was!==next?()=>{S.genre=was}:null);setTimeout(()=>{S.genre=next;render();},30);return;}
 if(t.dataset.appearance){S.appearance=t.dataset.appearance;return render();}
 if(t.dataset.ob){S.onboarding.step=+t.dataset.ob;return render();}
 if(t.dataset.obgenre){const ob=S.onboarding,g=t.dataset.obgenre,l=ob.genres||(ob.genres=[ob.genre]),i=l.indexOf(g);if(i>=0){if(l.length>1)l.splice(i,1);}else l.push(g);ob.genre=l[0];S.genre=({'Metal and hardcore':'metal','Electronic':'electronic','Classical':'classical'})[ob.genre]||'label';return render();}
 if(t.dataset.pgo){const v=t.dataset.pgo;const p=JSON.parse(t.dataset.pp||'{}');if(v==='newbooking'){S.overlay=DR.newbooking(S.overlay.q);return render();}return go(v,p);}
 if(t.dataset.ni){const n=S.notifs[+t.dataset.ni];n.unread=false;return go(n.go[0],n.go[1]);}
 if(t.dataset.nf){S.overlay.f=t.dataset.nf;return render();}
 if(t.dataset.star){S.rating.stars=+t.dataset.star;return render();}
 if(t.dataset.qtag){const q=t.dataset.qtag;S.rating.tags=S.rating.tags.includes(q)?S.rating.tags.filter(x=>x!==q):[...S.rating.tags,q];return render();}
 if(t.dataset.split){S.split=t.dataset.split;return render();}
 if(t.dataset.bstate){S.booking.state=t.dataset.bstate;S.overlay=null;toast('Status changed by hand, logged with your name');return;}
 const a=t.dataset.act;const r=t.getBoundingClientRect();S.anchor={top:r.top,bottom:r.bottom};
 const A={
  close:()=>{const m=t.dataset.msg;close();if(m)toast(m,t.dataset.undo?()=>{}:null);},

  import:()=>{S.import.step=1;S.overlay=DR.import();render();},importnext:()=>{if(t.dataset.file)S.import.file=t.dataset.file+', 212 contacts';S.import.step++;S.overlay=DR.import();render();},importback:()=>{S.import.step--;S.overlay=DR.import();render();},importdone:()=>{S.overlay=null;S.imported=true;render();toast('198 contacts imported, 9 merged',()=>{S.imported=false});},

document.addEventListener('change',e=>{const t=e.target;
 for(const h of LAAS.CHANGE)if(h(t,e))return;
 if(t.dataset.cf){const [k,o]=t.dataset.cf.split('|');S.filters[k]=t.checked?[...S.filters[k],o]:S.filters[k].filter(x=>x!==o);render();return;}
 if(t.dataset.dash){S.dash[t.dataset.dash]=t.checked;S.overlay=DR.customise();render();return;}
 if(t.dataset.photo!==undefined&&t.files&&t.files[0]){S.photos[t.dataset.photo]=URL.createObjectURL(t.files[0]);render();toast('Photo updated');return;}
 if(t.dataset.importfile!==undefined&&t.files&&t.files[0]){S.import.file=t.files[0].name;S.import.step=2;S.overlay=DR.import();render();return;}
 if(t.dataset.receipt!==undefined&&t.files&&t.files[0]){S.rcpt=t.files[0].name;const el=document.getElementById('rcpt');if(el)el.textContent=S.rcpt;return;}
 if(t.dataset.sf){S.statusFilter=t.checked?[...S.statusFilter,t.dataset.sf]:S.statusFilter.filter(x=>x!==t.dataset.sf);render();}
 if(t.dataset.check){S.checklist[t.dataset.check]=t.checked;render();toast(t.checked?'Ticked: '+t.dataset.check:'Unticked: '+t.dataset.check,()=>{S.checklist[t.dataset.check]=!t.checked});}
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open('palette',{q:'',sel:0});return;}

 if(e.key==='Escape'){if(S.overlay)close();else if(S.booking.sheet){S.booking.sheet=false;render();}else if(S.flowsOpen){S.flowsOpen=false;render();}return;}
 if(S.overlay&&S.overlay.type==='palette'){const items=[...document.querySelectorAll('.pal .it')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.overlay.sel=(S.overlay.sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;render();}if(e.key==='Enter'){e.preventDefault();items[S.overlay.sel]?.click();}}
 if(e.key==='Enter'&&e.target.matches('tr[data-go]'))e.target.click();
 if(e.key==='Enter'&&e.target.id==='ask'){document.querySelector('[data-act="ask"]').click();}
});
